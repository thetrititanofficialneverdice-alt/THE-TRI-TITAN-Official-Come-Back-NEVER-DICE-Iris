<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0b0e16;--panel:#141a28;--panel2:#1a2233;--line:#2b354b;--text:#eef2ff;--muted:#9ba8c2;--gold:#d8b66a;--blue:#7199e8;--green:#77c6a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26314b 0%,var(--bg) 55%);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:38px 18px 26px;text-align:center;border-bottom:1px solid var(--line);background:#0b0e16cc}
.mark{color:var(--gold);font-size:13px;letter-spacing:4px;font-weight:800}
h1{font-size:clamp(25px,5vw,43px);line-height:1.16;margin:13px auto 10px;max-width:900px}
.sub{color:var(--muted);max-width:720px;margin:auto}
.wrap{max-width:1150px;margin:26px auto;padding:0 16px 60px}
.langbox{display:flex;justify-content:center;gap:10px;margin:0 auto 24px}
button,select,input{font:inherit}
.lang{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 20px;border-radius:12px;cursor:pointer;font-weight:700}
.lang.active{border-color:var(--gold);background:#3a3020;color:#ffe4a5}
.toolbar{display:grid;grid-template-columns:minmax(200px,1fr) 230px;gap:12px;margin-bottom:18px}
input,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--blue)}
.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}
nav,.content{background:#101624;border:1px solid var(--line);border-radius:17px;padding:16px}
nav h3{margin:2px 8px 12px;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:9px;cursor:pointer}
.navbtn:hover,.navbtn.active{background:var(--panel2);color:var(--text)}
.content h2{margin:0 0 6px;font-size:24px}.intro{color:var(--muted);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}
.command{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
code{display:block;color:#ffe0a0;background:#242b3a;padding:7px 9px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.copy{flex:none;border:1px solid #43516c;background:#202a3d;color:#dce7ff;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12px}
.desc{color:var(--muted);font-size:14px;margin:10px 0 0}
.tag{display:inline-block;color:#9db8f5;background:#25324b;border-radius:20px;padding:3px 8px;font-size:11px;margin-bottom:9px}
.empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
a{color:#9db8f5}
@media(max-width:760px){.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.cards{grid-template-columns:1fr}nav{padding:12px}.navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}}
</style>
</head>

function translatedCommand(cmd,language){
 let out=cmd;
 const dict=commandTranslations[language];
 Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(key=>{
   const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   out=out.replace(new RegExp(escaped,'gi'),dict[key]);
 });
 return out;
}

let lang="uk",active="all";
const $=id=>document.getElementById(id);
function setLang(l){
 lang=l;document.documentElement.lang=l;
 $("ukBtn").classList.toggle("active",l==="uk");$("beBtn").classList.toggle("active",l==="be");
 $("subtitle").textContent=ui[l].subtitle;$("search").placeholder=ui[l].search;
 $("navTitle").textContent=ui[l].nav;$("category").setAttribute("aria-label",ui[l].category);$("sectionIntro").textContent=ui[l].intro;$("foot").innerHTML=ui[l].sourceLink+` <a href="https://teletype.in/@iris_cm/commands" target="_blank" rel="noopener">${l==="uk"?"Відкрити оригінальний сайт Iris":"Адкрыць арыгінальны сайт Iris"}</a>.`;
 renderNav();render();
}
function renderNav(){
 const t=ui[lang];
 $("navlist").innerHTML=`<button class="navbtn ${active==="all"?"active":""}" data-cat="all">${t.all}</button>`+
 Object.entries(cats).map(([k,v])=>`<button class="navbtn ${active===k?"active":""}" data-cat="${k}">${v[lang==="uk"?0:1]}</button>`).join("");
 $("category").innerHTML=`<option value="all">${t.all}</option>`+
 Object.entries(cats).map(([k,v])=>`<option value="${k}">${v[lang==="uk"?0:1]}</option>`).join("");
 $("category").value=active;
}
$("navlist").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){active=b.dataset.cat;renderNav();render();}});
$("category").addEventListener("change",e=>{active=e.target.value;renderNav();render();});
$("search").addEventListener("input",render);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const t=ui[lang],q=$("search").value.trim().toLocaleLowerCase();
 const list=rows.filter(r=>(active==="all"||r[0]===active)&&(!q||(r.slice(1).join(" ")+" "+translatedCommand(r[1],lang)).toLocaleLowerCase().includes(q)));
 $("sectionTitle").textContent=active==="all"?t.all:cats[active][lang==="uk"?0:1];
 $("sectionIntro").textContent=lang==="uk"?"Назви команд і описи перекладені українською мовою.":"Назвы каманд і апісанні перакладзеныя на беларускую мову.";
 const cards=$("cards");cards.innerHTML="";
 if(!list.length){cards.innerHTML=`<div class="empty">${t.empty}</div>`;return;}
 list.forEach(r=>{
  const [cat,cmd,uk,be]=r,card=document.createElement("article");card.className="card";
  card.innerHTML=`<span class="tag">${esc(cats[cat][lang==="uk"?0:1])}</span><div class="command"><code>${esc(translatedCommand(cmd,lang))}</code><button class="copy" type="button">${t.copy}</button></div><p class="desc">${esc(lang==="uk"?uk:be)}</p>`;
  card.querySelector("button").addEventListener("click",()=>copyCommand(card.querySelector("button"),translatedCommand(cmd,lang)));
  cards.appendChild(card);
 });
}
async function copyCommand(btn,value){
 const t=ui[lang];let ok=false;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);ok=true;}}catch(e){}
 if(!ok){
  const area=document.createElement("textarea");area.value=value;area.setAttribute("readonly","");
  area.style.position="fixed";area.style.left="-9999px";area.style.top="0";
  document.body.appendChild(area);area.focus();area.select();area.setSelectionRange(0,area.value.length);
  try{ok=document.execCommand("copy");}catch(e){ok=false;}area.remove();
 }
 if(ok){btn.textContent=t.copied;setTimeout(()=>{btn.textContent=ui[lang].copy;},1400);}
 else{
  btn.textContent=t.failed;
  const fallback=document.createElement("span");fallback.textContent=value;fallback.style.userSelect="all";fallback.style.marginLeft="8px";
  btn.parentElement.appendChild(fallback);setTimeout(()=>{btn.textContent=ui[lang].copy;fallback.remove();},4000);
 }
}
setLang("uk");
